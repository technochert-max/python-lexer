<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Комментарий в заголовке -->
    <title>Сущности и комментарии</title>
</head>
<body>
    <!-- Комментарий перед текстом -->
    <p>Символы: &amp; &lt; &gt; &quot; &apos; &copy; &nbsp;</p>
    <p>Числовые сущности: &#169; и &#x1F680;</p>
    <p>Кавычки: "двойные" и 'одинарные'.</p>
</body>
</html>
