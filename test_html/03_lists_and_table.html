<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Списки и таблица</title></head>
<body>
    <h1>Каталог</h1>
    <ul>
        <li>Компьютеры</li>
        <li>Комплектующие
            <ol>
                <li>Процессоры</li>
                <li>Видеокарты</li>
            </ol>
        </li>
        <li>Периферия</li>
    </ul>
    <table border="1">
        <thead><tr><th>Название</th><th>Количество</th></tr></thead>
        <tbody>
            <tr><td>Клавиатура</td><td>12</td></tr>
            <tr><td>Мышь</td><td>25</td></tr>
        </tbody>
    </table>
</body>
</html>
